apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-mlops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-mlops
  template:
    metadata:
      labels:
        app: iris-mlops
    spec:
      containers:
        - name: iris-mlops
          image: iris-mlops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
