name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Train model with Python 3.11
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/app \
            -w /app \
            python:3.11-slim \
            sh -c "pip install --no-cache-dir -r requirements.txt && python src/train.py"

      - name: Build Docker image
        run: docker build -t iris-mlops:latest .

      - name: Load image into Kind
        run: kind load docker-image iris-mlops:latest --name three-node-cluster

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/iris-mlops
